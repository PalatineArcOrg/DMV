  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    try { console.error('[bundle]', (e && (e.message || e.type)) || 'error'); } catch (_) {}
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:#00FFA3;color:#00FFA3;\">GitHub<\u002Fa>\n  <\u002Fnav>\n\n  <div style=\"max-width:1160px;margin:0 auto;padding:56px 48px 0;\">\n    <div data-reveal=\"\" style=\"transform:translateY(18px);transition:transform .7s cubic-bezier(.16,1,.3,1);font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#00FFA3;text-transform:uppercase;margin-bottom:14px;\">Monolith — Solana Mobile Hackathon 2026<\u002Fdiv>\n    <h1 data-reveal=\"\" data-reveal-delay=\"30\" style=\"transform:translateY(18px);transition:transform .7s cubic-bezier(.16,1,.3,1);font-size:44px;font-weight:600;letter-spacing:-1px;margin:0 0 14px;max-width:700px;\">Your crypto should outlive you.<\u002Fh1>\n    <p data-reveal=\"\" data-reveal-delay=\"60\" style=\"transform:translateY(18px);transition:transform .7s cubic-bezier(.16,1,.3,1);font-size:16px;line-height:1.7;color:rgba(242,242,240,0.6);margin:0 0 36px;max-width:640px;\">An autonomous crypto inheritance protocol on Solana — built for the Seeker, runs on any modern Android. Permissionless execution means no trusted trigger and no held keys. Drag through the five escalation stages below, then tap the confirm button on the phone itself — the monitor, the status card and the phone all recover live, exactly like the on-device app.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1160px;margin:0 auto;padding:0 48px 48px;\">\n    <div data-reveal=\"\" data-reveal-delay=\"20\" style=\"transform:translateY(18px);transition:transform .7s cubic-bezier(.16,1,.3,1);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:36px;display:grid;grid-template-columns:1.3fr 0.7fr;gap:44px;background:#0E0F12;\">\n      <div>\n        <svg viewBox=\"0 0 400 60\" style=\"width:100%;height:60px;display:block;margin-bottom:10px;\"><path d=\"{{ cur.ecg }}\" fill=\"none\" stroke=\"{{ cur.color }}\" stroke-width=\"2.5\" style=\"transition:stroke .25s ease;\"><\u002Fpath><\u002Fsvg>\n        <div style=\"position:relative;display:flex;align-items:center;margin:22px 0 30px;\">\n          <div style=\"position:absolute;left:14px;right:14px;top:7px;height:2px;background:rgba(255,255,255,0.1);\"><\u002Fdiv>\n          <sc-for list=\"{{ stageButtons }}\" as=\"btn\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ btn.onClick }}\" style=\"position:relative;flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px;padding:0;opacity:{{ btn.opacity }};\">\n              <div style=\"width:15px;height:15px;border-radius:50%;background:{{ btn.color }};transform:scale({{ btn.scale }});transition:transform .25s,opacity .25s;box-shadow:0 0 0 5px {{ btn.ring }};\"><\u002Fdiv>\n              <div style=\"font-family:'Geist Mono',monospace;font-size:10.5px;color:{{ btn.labelColor }};\">{{ btn.n }} · {{ btn.label }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:10px;\">\n          <span style=\"font-family:'Geist Mono',monospace;font-size:12.5px;color:{{ cur.color }};font-weight:600;\">STAGE {{ cur.n }}<\u002Fspan>\n          <span style=\"font-weight:600;font-size:21px;\">{{ cur.title }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:15px;color:rgba(242,242,240,0.6);line-height:1.7;max-width:440px;margin-bottom:12px;\">{{ cur.desc }}<\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:11.5px;color:rgba(242,242,240,0.4);\">{{ cur.timing }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px;\">\n        <x-import component-from-global-scope=\"AndroidDevice\" from=\"5b32f1a3-0036-4e99-91f8-9db361b18ec6#\u002Fandroid-frame.jsx\" width=\"{{ 280 }}\" height=\"{{ 606 }}\" dark=\"{{ true }}\" hint-size=\"280px,606px\">\n          <div style=\"background:#07090F;min-height:100%;padding:14px 12px 18px;font-family:'Archivo',sans-serif;\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;\">\n              <div style=\"display:flex;align-items:center;gap:7px;\">\n                <div style=\"width:26px;height:26px;border-radius:7px;background:rgba(153,69,255,0.18);border:1px solid rgba(153,69,255,0.3);display:flex;align-items:center;justify-content:center;\">\n                  <svg width=\"12\" height=\"12\" viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"30\" fill=\"none\" stroke=\"#00FFA3\" stroke-width=\"9\"\u002F><path d=\"M28 50 H36 L41 33 L48 67 L53 50 H72\" fill=\"none\" stroke=\"#00FFA3\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"\u002F><\u002Fsvg>\n                <\u002Fdiv>\n                <div style=\"color:#fff;font-weight:700;font-size:10.5px;\">Dead Man's Vault<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#0F1521;border-radius:13px;border:1.5px solid {{ cur.color }};overflow:hidden;margin-bottom:10px;transition:border-color .25s;\">\n              <div style=\"height:3px;background:{{ cur.color }};transition:background .25s;\"><\u002Fdiv>\n              <div style=\"padding:11px 11px 3px;display:flex;align-items:center;gap:7px;\">\n                <div style=\"width:6.5px;height:6.5px;border-radius:50%;background:{{ cur.color }};\"><\u002Fdiv>\n                <div>\n                  <div style=\"color:#fff;font-size:10px;font-weight:700;\">{{ cur.appStatus }}<\u002Fdiv>\n                  <div style=\"color:rgba(255,255,255,0.4);font-size:8px;\">{{ cur.appSub }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:center;padding:10px 0 8px;\">\n                <div style=\"width:58px;height:58px;border-radius:50%;border:2px solid {{ cur.color }};display:flex;align-items:center;justify-content:center;transition:border-color .25s, transform .2s ease-out, box-shadow .3s ease-out;transform:scale({{ pulseScale }});box-shadow:{{ pulseShadow }};\">\n                  <sc-if value=\"{{ curIsCheck }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"width:17px;height:10px;border-left:2px solid {{ cur.color }};border-bottom:2px solid {{ cur.color }};transform:rotate(-45deg) translate(2px,-2px);\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ curIsAlert }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-weight:700;font-size:19px;color:{{ cur.color }};\">!<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ curIsFlash }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:14px solid {{ cur.color }};transform:skewX(-8deg);\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ canConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n                <button onclick=\"{{ confirmHeartbeat }}\" style=\"display:block;width:calc(100% - 22px);margin:0 11px 10px;text-align:center;background:{{ cur.color }};color:#07090F;border:none;border-radius:7px;padding:7px 0;font-weight:700;font-size:9px;cursor:pointer;font-family:'Archivo',sans-serif;transition:opacity .15s,background-color .25s;\" style-hover=\"opacity:0.85;\">{{ cur.appButton }}<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ isExecuted }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"text-align:center;color:rgba(255,255,255,0.4);font-size:8px;margin-bottom:10px;cursor:not-allowed;\">{{ cur.appButton }} · irreversible<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ isNormalConfirmed }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"text-align:center;color:rgba(255,255,255,0.55);font-size:8px;margin-bottom:10px;\">{{ cur.appButton }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"background:#0F1521;border-radius:13px;border:1px solid rgba(255,255,255,0.07);padding:12px;margin-bottom:10px;\">\n              <div style=\"color:rgba(255,255,255,0.4);font-size:8px;font-weight:600;letter-spacing:1px;margin-bottom:7px;\">VAULT BALANCE<\u002Fdiv>\n              <div style=\"color:#00FFA3;font-size:18px;font-weight:700;\">12.4000 SOL<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#0F1521;border-radius:13px;border:1px solid rgba(255,255,255,0.07);padding:12px;\">\n              <div style=\"color:rgba(255,255,255,0.4);font-size:8px;font-weight:600;letter-spacing:1px;margin-bottom:7px;\">YOUR PORTFOLIO<\u002Fdiv>\n              <div style=\"color:#fff;font-size:18px;font-weight:700;margin-bottom:8px;\">$4,218.90<\u002Fdiv>\n              <div style=\"height:1px;background:rgba(255,255,255,0.06);margin-bottom:6px;\"><\u002Fdiv>\n              <sc-for list=\"{{ phoneTokens }}\" as=\"tok\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:8px;padding:6px 0;\">\n                  <div style=\"width:22px;height:22px;border-radius:11px;background:{{ tok.bg }};border:1px solid {{ tok.border }};display:flex;align-items:center;justify-content:center;font-size:5.5px;font-weight:700;color:{{ tok.color }};\">{{ tok.sym }}<\u002Fdiv>\n                  <div style=\"flex:1;\">\n                    <div style=\"color:#fff;font-size:9.5px;font-weight:600;\">{{ tok.sym }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"color:#fff;font-size:9.5px;font-weight:600;\">{{ tok.usd }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fx-import>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:10.5px;color:rgba(242,242,240,0.35);text-align:center;max-width:230px;line-height:1.5;\">Tap the button on stages 1–3 to confirm the heartbeat and watch it recover live<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1160px;margin:0 auto;padding:0 48px 40px;\">\n    <div style=\"display:flex;gap:28px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:28px;\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button onclick=\"{{ t.onClick }}\" style=\"background:none;border:none;cursor:pointer;padding:0 0 16px;font-size:14px;color:{{ t.color }};border-bottom:2px solid {{ t.borderColor }};font-weight:500;transition:color .2s,border-color .2s;\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isTabProblem }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <p style=\"font-size:15px;color:rgba(242,242,240,0.6);line-height:1.7;max-width:660px;margin:0 0 28px;\">Crypto doesn’t have a next-of-kin form. Millions in assets are lost every year because there’s no decentralized way to pass them on — traditional inheritance simply doesn’t work for a self-custodied wallet.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;\">\n          <sc-for list=\"{{ stats }}\" as=\"stat\" hint-placeholder-count=\"3\">\n            <div>\n              <div style=\"font-family:'Geist Mono',monospace;font-size:34px;font-weight:600;color:{{ stat.color }};margin-bottom:10px;\">{{ stat.value }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:rgba(242,242,240,0.5);line-height:1.6;max-width:260px;\">{{ stat.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isTabFeatures }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px 32px;\">\n        <sc-for list=\"{{ features }}\" as=\"f\" hint-placeholder-count=\"6\">\n          <div>\n            <div style=\"font-weight:600;font-size:14.5px;margin-bottom:6px;\">{{ f.title }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:rgba(242,242,240,0.52);line-height:1.6;\">{{ f.desc }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isTabProgram }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <p style=\"font-size:15px;color:rgba(242,242,240,0.6);line-height:1.7;max-width:660px;margin:0 0 28px;\">The program only enforces <b style=\"color:#F2F2F0;\">who<\u002Fb> can receive funds, <b style=\"color:#F2F2F0;\">where<\u002Fb> they go, <b style=\"color:#F2F2F0;\">when<\u002Fb> they’re allowed, and <b style=\"color:#F2F2F0;\">how much<\u002Fb> — even permissionless execution can’t bypass these constraints.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:24px;\">\n          <sc-for list=\"{{ programSpecs }}\" as=\"spec\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"font-family:'Geist Mono',monospace;font-size:26px;font-weight:600;color:#00FFA3;margin-bottom:6px;\">{{ spec.value }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:rgba(242,242,240,0.45);\">{{ spec.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:12px;color:rgba(242,242,240,0.5);background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:14px 18px;display:inline-block;\">GXCu5964mvgAJDWmcMriZpzU3vDVqPzjYCM1sxCnsoEb · Devnet<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isTabWhy }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:20px 32px;margin-bottom:28px;\">\n          <sc-for list=\"{{ whyPoints }}\" as=\"w\" hint-placeholder-count=\"4\">\n            <div>\n              <div style=\"font-weight:600;font-size:14.5px;margin-bottom:6px;\">{{ w.title }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:rgba(242,242,240,0.52);line-height:1.6;\">{{ w.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:11.5px;color:rgba(242,242,240,0.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;\">Architecture<\u002Fdiv>\n        <sc-for list=\"{{ archLayers }}\" as=\"a\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;gap:14px;padding:8px 0;\">\n            <span style=\"font-weight:500;font-size:13px;min-width:230px;\">{{ a.title }}<\u002Fspan>\n            <span style=\"font-size:12.5px;color:rgba(242,242,240,0.5);\">{{ a.desc }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"font-family:'Geist Mono',monospace;font-size:11.5px;color:rgba(242,242,240,0.4);line-height:1.9;margin-top:14px;\">{{ techStackLine }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <section style=\"max-width:1160px;margin:0 auto;padding:56px 48px;border-top:1px solid rgba(255,255,255,0.08);\">\n    <div data-reveal=\"\" style=\"transform:translateY(18px);transition:transform .7s cubic-bezier(.16,1,.3,1);font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#00FFA3;text-transform:uppercase;margin-bottom:22px;\">Demo<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:28px;\">\n      <div data-reveal=\"\" style=\"transform:translateY(18px);transition:transform .7s cubic-bezier(.16,1,.3,1);background:#0E0F12;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px;\">\n        <div style=\"font-size:13.5px;margin-bottom:12px;color:rgba(242,242,240,0.7);\">Short demo<\u002Fdiv>\n        <div style=\"position:relative;width:100%;max-width:200px;aspect-ratio:9\u002F16;border-radius:8px;overflow:hidden;margin:0 auto;\">\n          <iframe src=\"https:\u002F\u002Fwww.youtube.com\u002Fembed\u002FLetYFctqcvM\" title=\"Dead Man's Vault — Short Demo\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen=\"\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;\"><\u002Fiframe>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-reveal-delay=\"80\" style=\"transform:translateY(18px);transition:transform .7s cubic-bezier(.16,1,.3,1);background:#0E0F12;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px;\">\n        <div style=\"font-size:13.5px;margin-bottom:12px;color:rgba(242,242,240,0.7);\">Full vault cycle<\u002Fdiv>\n        <div style=\"position:relative;width:100%;aspect-ratio:16\u002F9;border-radius:8px;overflow:hidden;\">\n          <iframe src=\"https:\u002F\u002Fwww.youtube.com\u002Fembed\u002Fp2dqby2mJcc\" title=\"Dead Man's Vault — Full Demo\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen=\"\" style=\"position:absolute;top:0;left:0;width:100%;height:100%;\"><\u002Fiframe>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1160px;margin:0 auto;padding:0 48px 64px;\">\n    <div data-reveal=\"\" style=\"transform:translateY(18px);transition:transform .7s cubic-bezier(.16,1,.3,1);font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#00FFA3;text-transform:uppercase;margin-bottom:22px;\">Get started<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px;\">\n      <sc-for list=\"{{ downloads }}\" as=\"d\" hint-placeholder-count=\"3\">\n        <div data-reveal=\"\" data-reveal-delay=\"{{ d.delay }}\" style=\"transform:translateY(18px);transition:transform .7s cubic-bezier(.16,1,.3,1);background:#0E0F12;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:26px 22px;\">\n          <div style=\"font-weight:600;font-size:15.5px;margin-bottom:10px;\">{{ d.title }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:rgba(242,242,240,0.5);line-height:1.6;margin-bottom:18px;min-height:52px;\">{{ d.desc }}<\u002Fdiv>\n          <sc-if value=\"{{ d.cta }}\" hint-placeholder-val=\"{{ true }}\">\n            <a href=\"{{ d.href }}\" target=\"_blank\" style=\"display:inline-block;background:#00FFA3;color:#0B0C0E;padding:9px 20px;border-radius:6px;font-weight:600;font-size:12px;text-decoration:none;margin-bottom:12px;\">{{ d.cta }}<\u002Fa>\n          <\u002Fsc-if>\n          <div style=\"font-family:'Geist Mono',monospace;font-size:10px;color:{{ d.color }};\">{{ d.badge }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid rgba(255,255,255,0.08);padding:36px 48px;text-align:center;\">\n    <div style=\"display:flex;justify-content:center;gap:26px;margin-bottom:16px;flex-wrap:wrap;\">\n      <a href=\"https:\u002F\u002Fgithub.com\u002FRomulus-Sol\u002FDMV\" target=\"_blank\" style=\"color:rgba(242,242,240,0.5);text-decoration:none;font-size:13px;\">GitHub<\u002Fa>\n      <a href=\"https:\u002F\u002Fexplorer.solana.com\u002Faddress\u002FGXCu5964mvgAJDWmcMriZpzU3vDVqPzjYCM1sxCnsoEb?cluster=devnet\" target=\"_blank\" style=\"color:rgba(242,242,240,0.5);text-decoration:none;font-size:13px;\">Program on Explorer<\u002Fa>\n      <a href=\"https:\u002F\u002Fdmv.palatinearc.com\" target=\"_blank\" style=\"color:rgba(242,242,240,0.5);text-decoration:none;font-size:13px;\">Website<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;color:rgba(242,242,240,0.35);\">© 2026 Romulus-Sol · MIT Licensed · Built for the Monolith Hackathon<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { stage: 0, tab: 'problem', isResetting: false, pulse: false };\n  _scrollCleanup = null;\n\n  setStage = (n) => {\n    this._clearResetTimer();\n    this.setState({ stage: n, isResetting: false, pulse: false });\n  };\n  setTab = (t) => { this.setState({ tab: t }); };\n\n  _clearResetTimer() {\n    if (this._resetTimer) { clearTimeout(this._resetTimer); this._resetTimer = null; }\n  }\n\n  \u002F\u002F Simulates confirming the heartbeat on-device: steps the stage back down\n  \u002F\u002F to Normal one at a time (rather than jumping straight there) so the\n  \u002F\u002F monitor, status card, and phone screen all visibly \"recover\" in sync.\n  confirmHeartbeat = () => {\n    const { stage, isResetting } = this.state;\n    if (isResetting || stage <= 0 || stage >= 4) return;\n    this._clearResetTimer();\n    this.setState({ isResetting: true });\n    this._pulseAndStep(stage);\n  };\n\n  _pulseAndStep = (currentStage) => {\n    this.setState({ pulse: true });\n    this._resetTimer = setTimeout(() => {\n      const next = currentStage - 1;\n      this.setState({ stage: next, pulse: false });\n      if (next > 0) {\n        this._resetTimer = setTimeout(() => this._pulseAndStep(next), 200);\n      } else {\n        this._resetTimer = setTimeout(() => this.setState({ isResetting: false }), 450);\n      }\n    }, 280);\n  };\n\n  componentDidMount() {\n    const bar = document.querySelector('[data-progress-bar]');\n    const pending = Array.prototype.slice.call(document.querySelectorAll('[data-reveal]'));\n\n    const reveal = function (el) {\n      const delay = el.getAttribute('data-reveal-delay') || '0';\n      el.style.transitionDelay = delay + 'ms';\n      el.style.transform = 'translateY(0)';\n    };\n\n    const checkReveals = function () {\n      if (pending.length === 0) return;\n      for (let i = pending.length - 1; i >= 0; i--) {\n        const el = pending[i];\n        const r = el.getBoundingClientRect();\n        if (r.top < window.innerHeight - 30 && r.bottom > 0) {\n          reveal(el);\n          pending.splice(i, 1);\n        }\n      }\n    };\n\n    const onScroll = function () {\n      if (bar) {\n        const max = document.documentElement.scrollHeight - window.innerHeight;\n        const pct = max > 0 ? Math.max(0, Math.min(1, window.scrollY \u002F max)) : 0;\n        bar.style.width = (pct * 100).toFixed(2) + '%';\n      }\n      checkReveals();\n    };\n\n    window.addEventListener('scroll', onScroll, { passive: true });\n    window.addEventListener('resize', onScroll, { passive: true });\n    onScroll();\n    this._scrollCleanup = function () {\n      window.removeEventListener('scroll', onScroll);\n      window.removeEventListener('resize', onScroll);\n    };\n  }\n\n  componentWillUnmount() {\n    if (this._scrollCleanup) this._scrollCleanup();\n    this._clearResetTimer();\n  }\n\n  renderVals() {\n    const statsBase = [\n      { tone: 'accent', value: '$140B+', label: 'Estimated value of inaccessible Bitcoin alone. Keys lost forever.' },\n      { tone: 'warning', value: '4M+', label: 'Bitcoin wallets with no activity in 5+ years. Many owners may no longer be alive.' },\n      { tone: 'critical', value: '0', label: 'Decentralized inheritance solutions on Solana Mobile. Until now.' },\n    ];\n    const stageConfig = [\n      { n: 0, title: 'Normal', desc: 'Heartbeat confirmed. All clear. Assets safe and beneficiaries on standby.', timing: 'Weekly \u002F bi-weekly \u002F monthly', color: '#00FFA3', appStatus: 'Vault Active', appSub: 'All systems normal', appButton: 'Heartbeat Confirmed', icon: 'check', ecg: 'M0,30 L120,30 L130,30 L140,22 L150,38 L160,30 L400,30' },\n      { n: 1, title: 'Reminder', desc: 'Overdue. Push notifications sent to owner. One tap resets to normal.', timing: 'Duration: 3 days', color: '#F59E0B', appStatus: 'Heartbeat Overdue', appSub: 'Reminder notification sent', appButton: 'Confirm Heartbeat', icon: 'alert', ecg: 'M0,30 L60,30 L68,16 L76,44 L84,30 L200,30 L208,16 L216,44 L224,30 L400,30' },\n      { n: 2, title: 'Alert', desc: 'No response. Notifications intensify — urgent alerts sent to your device.', timing: 'Duration: 7 days', color: '#F97316', appStatus: 'Emergency Alert', appSub: 'Beneficiaries have been notified', appButton: 'Confirm NOW', icon: 'alert', ecg: 'M0,30 L40,30 L47,10 L54,50 L61,30 L120,30 L127,10 L134,50 L141,30 L200,30 L207,10 L214,50 L221,30 L400,30' },\n      { n: 3, title: 'Warning', desc: 'Final countdown. Hourly notifications. Last chance to confirm liveness.', timing: 'Duration: 7 days', color: '#EF4444', appStatus: 'Final Warning', appSub: '< 24 hours until execution', appButton: 'CONFIRM IMMEDIATELY', icon: 'alert', ecg: 'M0,30 L20,30 L26,4 L32,56 L38,30 L70,30 L76,4 L82,56 L88,30 L120,30 L126,4 L132,56 L138,30 L170,30 L176,4 L182,56 L188,30 L400,30' },\n      { n: 4, title: 'Execution', desc: 'Grace has elapsed. Anyone \\u2014 the app, a beneficiary, or the bundled keyless watcher \\u2014 can now permissionlessly execute the distribution computed on-chain.', timing: 'Permissionless \\u00b7 any signer can execute', color: '#DC2626', appStatus: 'Distributing Assets', appSub: 'Vault execution in progress\\u2026', appButton: 'View Execution Log', icon: 'flash', ecg: 'M0,30 L150,30 L157,2 L164,58 L171,30 L400,30' },\n    ];\n    const featuresBase = [\n      { title: 'Permissionless Execution', desc: 'After grace, the program computes every payout from on-chain state. The app, a beneficiary, or a keyless watcher can submit it \\u2014 no trusted trigger, no held keys.' },\n      { title: 'Specific Bequests + Pro-Rata', desc: 'Assign exact SPL amounts, tokenized stocks (Token-2022 RWAs), or whole NFTs to specific beneficiaries, carved out first. The remainder splits pro-rata by share.' },\n      { title: 'Crash-Proof, Resumable', desc: 'Frozen snapshots and idempotent on-chain bitmasks mean a partial crank is safely resumed by anyone, exactly where it left off.' },\n      { title: 'Live Portfolio Tracking', desc: 'Token balances via Helius DAS, dual-oracle USD pricing (Pyth + Jupiter), DeFi position detection across 10 protocols.' },\n      { title: 'On-Chain Beneficiary Whitelist', desc: 'The program only pays pre-approved wallets \\u2014 up to 20 beneficiaries with basis-point share allocation.' },\n      { title: 'Biometric App Lock', desc: 'Optional biometric or PIN authentication guards app access, with automatic state reset on wallet change to prevent cross-wallet access.' },\n    ];\n    const programSpecs = [\n      { label: 'Instructions', value: '18' },\n      { label: 'Error Codes', value: '37' },\n      { label: 'Tests Passing', value: '20\u002F20' },\n      { label: 'Mutability', value: 'Owner\\u2019s choice' },\n    ];\n    const whyPointsBase = [\n      { title: 'No Trusted Trigger', desc: 'After grace, anyone \\u2014 the app, a beneficiary, or a bundled keyless watcher \\u2014 can submit the distribution. No server ever holds the keys.' },\n      { title: 'Any Android, Seeker Recommended', desc: 'Owner signing uses standard Mobile Wallet Adapter \\u2014 Phantom, Solflare, or any MWA wallet. Seeker\\u2019s Seed Vault gives the strongest custody, but isn\\u2019t required.' },\n      { title: 'Owner Supremacy (Pre-Grace)', desc: 'Owner can override, withdraw, revoke, or rotate at any time before the deadline. Once grace elapses, the program freezes every owner mutation.' },\n      { title: 'Graduated Escalation', desc: '17 days of warnings before execution. Any heartbeat at Stages 1\\u20133 resets to normal \\u2014 Stage 4 is the only irreversible action.' },\n    ];\n    const archLayers = [\n      { title: 'Anchor Program (Rust)', desc: '18 instructions \\u00b7 on-chain constraint enforcement' },\n      { title: 'React Native (Expo SDK 52)', desc: 'Orchestration, scanning, escalation, execution' },\n      { title: 'Keyless Watcher (Node.js)', desc: 'Express + SQLite \\u00b7 autonomous permissionless crank' },\n      { title: 'Zustand + SQLite', desc: 'State management + crash recovery checkpoints' },\n      { title: 'Solana Mobile MWA', desc: 'Owner authorization \\u2014 any MWA wallet' },\n      { title: 'Secure Enclave Agent Key', desc: 'Seeker TEE or Android Keystore \\u2014 signs heartbeats only' },\n      { title: 'Helius + Pyth + Jupiter', desc: 'Portfolio data, price oracles, priority fees' },\n    ];\n    const techStackLine = 'Anchor 0.32.1   \\u00b7   Solana CLI 3.0.15   \\u00b7   Rust 1.93.1   \\u00b7   Expo SDK 52   \\u00b7   React Native 0.76.9   \\u00b7   @coral-xyz\u002Fanchor 0.32.1   \\u00b7   TypeScript 5.x   \\u00b7   @solana\u002Fweb3.js 1.x';\n    const downloadsBase = [\n      { title: 'Devnet APK', desc: 'Test the full flow on Solana Devnet \\u2014 works with any Mobile Wallet Adapter wallet (Seeker\\u2019s Seed Vault recommended). Latest release: v1.13.16', cta: 'Download APK', href: 'https:\u002F\u002Fgithub.com\u002FRomulus-Sol\u002FDMV\u002Freleases\u002Flatest', tone: 'live', badge: 'Available Now' },\n      { title: 'GitHub', desc: 'Open-source. MIT licensed. Full Anchor program plus the React Native app.', cta: 'View Source', href: 'https:\u002F\u002Fgithub.com\u002FRomulus-Sol\u002FDMV', tone: 'live', badge: 'Open Source' },\n      { title: 'Mainnet', desc: 'Production release with a full security audit and Google Play distribution.', cta: null, href: null, tone: 'soon', badge: 'Coming Soon' },\n    ];\n    const phoneTokens = [\n      { sym: 'SOL', usd: '$3,712.40', bg: 'rgba(153,69,255,0.16)', border: 'rgba(153,69,255,0.4)', color: '#9945FF' },\n      { sym: 'USDC', usd: '$412.00', bg: 'rgba(77,166,255,0.16)', border: 'rgba(77,166,255,0.4)', color: '#4DA6FF' },\n      { sym: 'mSOL', usd: '$94.50', bg: 'rgba(155,225,218,0.16)', border: 'rgba(155,225,218,0.4)', color: '#9BE1DA' },\n    ];\n\n    const withDelay = (arr, step) => arr.map(function (x, i) { return Object.assign({}, x, { delay: i * step }); });\n    const withCode = (arr) => arr.map(function (x, i) { return Object.assign({}, x, { code: '0' + (i + 1) }); });\n    const toneMap = { accent: '#00FFA3', warning: '#F59E0B', critical: '#EF4444', live: '#00FFA3', soon: 'rgba(242,244,247,0.4)' };\n    const mkToned = (arr, step) => arr.map(function (x, i) { return Object.assign({}, x, { delay: i * step, color: toneMap[x.tone] }); });\n\n    const stage = this.state.stage;\n    const cur = stageConfig[stage];\n    const stageButtons = stageConfig.map((s) => {\n      const active = s.n === stage;\n      return {\n        n: s.n, label: s.title, onClick: () => this.setStage(s.n),\n        color: s.color, ring: s.color + '30',\n        scale: active ? 1.15 : 1, opacity: active ? 1 : 0.5,\n        labelColor: active ? '#F2F2F0' : 'rgba(242,242,240,0.4)',\n      };\n    });\n    const pulse = this.state.pulse;\n    const pulseScale = pulse ? 1.14 : 1;\n    const pulseShadow = pulse ? ('0 0 0 8px ' + cur.color + '33') : ('0 0 0 0px ' + cur.color + '00');\n    const canConfirm = stage >= 1 && stage <= 3;\n    const isExecuted = stage === 4;\n    const isNormalConfirmed = stage === 0;\n    const tabDefs = [\n      { key: 'problem', label: 'The Problem' },\n      { key: 'features', label: 'Features' },\n      { key: 'program', label: 'On-Chain Program' },\n      { key: 'why', label: 'Why DMV' },\n    ];\n    const tabs = tabDefs.map((t) => {\n      const active = this.state.tab === t.key;\n      return Object.assign({}, t, {\n        onClick: () => this.setTab(t.key),\n        color: active ? '#F2F2F0' : 'rgba(242,242,240,0.45)',\n        borderColor: active ? '#00FFA3' : 'transparent',\n      });\n    });\n\n    return {\n      cur: cur,\n      stageButtons: stageButtons,\n      tabs: tabs,\n      curIsCheck: cur.icon === 'check',\n      curIsAlert: cur.icon === 'alert',\n      curIsFlash: cur.icon === 'flash',\n      isTabProblem: this.state.tab === 'problem',\n      isTabFeatures: this.state.tab === 'features',\n      isTabProgram: this.state.tab === 'program',\n      isTabWhy: this.state.tab === 'why',\n      stats: mkToned(statsBase, 90),\n      features: withCode(withDelay(featuresBase, 55)),\n      programSpecs: programSpecs,\n      whyPoints: withDelay(whyPointsBase, 65),\n      archLayers: archLayers,\n      techStackLine: techStackLine,\n      downloads: mkToned(downloadsBase, 70),\n      phoneTokens: phoneTokens,\n      pulseScale: pulseScale,\n      pulseShadow: pulseShadow,\n      canConfirm: canConfirm,\n      isExecuted: isExecuted,\n      isNormalConfirmed: isNormalConfirmed,\n      confirmHeartbeat: this.confirmHeartbeat,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
