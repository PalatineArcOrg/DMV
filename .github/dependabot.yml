version: 2
# Skip major-version bumps (they break the pinned toolchain — Anchor 0.32.1,
# Expo SDK 52, etc.) and group the safe minor/patch updates into one PR per
# ecosystem to keep the noise down. Security updates always come through.
updates:
  # Mobile app (Yarn / npm ecosystem)
  - package-ecosystem: "npm"
    directory: "/dead-mans-vault/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "app"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Expo SDK-managed — update these via an SDK bump (`expo install`), not
      # individual PRs, or they misalign with the pinned SDK (RN 0.76.x for SDK 52).
      # NB: dependabot classifies react-native 0.76 -> 0.86 as "minor", so an
      # explicit name ignore is required, not just the semver-major rule above.
      - dependency-name: "react-native"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      # MWA 2.2.9 uses package `exports` subpaths that Metro (Expo SDK 52) can't
      # resolve without config — the release bundle fails. Bump deliberately, not
      # via auto-PR.
      - dependency-name: "@solana-mobile/*"
    groups:
      app-minor-patch:
        update-types: ["minor", "patch"]

  # Anchor test harness deps (ts-mocha, chai, etc.)
  - package-ecosystem: "npm"
    directory: "/dead-mans-vault"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "anchor-tests"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      anchor-tests-minor-patch:
        update-types: ["minor", "patch"]

  # Notify-server
  - package-ecosystem: "npm"
    directory: "/notify-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "notify-server"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      notify-server-minor-patch:
        update-types: ["minor", "patch"]

  # On-chain program (Cargo workspace). Anchor is pinned to 0.32.1, so even a
  # minor bump (0.32 -> 0.33) is breaking — allow patch updates only.
  - package-ecosystem: "cargo"
    directory: "/dead-mans-vault"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "program"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      program-patch:
        update-types: ["patch"]

  # GitHub Actions workflows (major bumps here are low-risk; grouped into one PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    ignore:
      # Pinned deliberately to the project toolchain (Rust 1.89.0, per rust-toolchain.toml) — don't bump.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns: ["*"]
