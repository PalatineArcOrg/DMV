version: 2
updates:
  # Mobile app (Yarn / npm ecosystem)
  - package-ecosystem: "npm"
    directory: "/dead-mans-vault/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "app"]

  # Anchor test harness deps (ts-mocha, chai, etc.)
  - package-ecosystem: "npm"
    directory: "/dead-mans-vault"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "anchor-tests"]

  # Notify-server
  - package-ecosystem: "npm"
    directory: "/notify-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "notify-server"]

  # On-chain program (Cargo workspace)
  - package-ecosystem: "cargo"
    directory: "/dead-mans-vault"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "program"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
