name: CI

on:
  push:
    branches: [devnet, main, mainnet]
  pull_request:
  workflow_dispatch: # manual trigger for the release-tier `integration` job (below)

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Notify-server: unit tests + dependency audit ----
  notify-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notify-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24' # match the runtime (systemd runs node 24); node 20's
          # CJS→ESM lexer misses some @coral-xyz/anchor named re-exports
      - run: npm install
      - name: Unit tests (owner-signed register/deregister, etc.)
        run: npm test
      # BLOCKING: fails on any NEW high/critical. Accepted advisories (transitive via
      # @solana/web3.js, low-reachability) are allowlisted in security/audit-ci.jsonc, with
      # full rationale in security/dependency-waivers.md. To accept a new one, add it there.
      - name: Dependency audit (high/critical — BLOCKING; waivers in security/)
        # Exact-pinned (not @7) so a patch release can't shift the gate's behavior. Run via
        # npx (not a devDependency) so audit-ci's own deps stay OUT of the audited tree.
        run: npx --yes audit-ci@7.1.0 --config ../security/audit-ci.jsonc

  # ---- Keeper-bot: install + syntax/import smoke ----
  # Runs the pure readiness/crank/guard unit tests (npm test). index.js self-executes (the crank loop),
  # so it is only syntax-checked, never imported; crank.js is exports-only and gets an import smoke.
  keeper-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper-bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Syntax check (all src)
        run: for f in src/*.js; do node --check "$f"; done
      - name: Import smoke (crank.js — exports only, no crank side effect)
        run: node -e "import('./src/crank.js').then(() => console.log('crank.js imports OK'))"
      - name: Readiness unit tests (pure; does NOT import the crank)
        run: npm test

  # ---- Mobile app: TypeScript typecheck ----
  app-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dead-mans-vault/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24' # needed for `node --test` TypeScript type-stripping
      - run: yarn install --frozen-lockfile
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests (raw account parsers, etc.)
        run: yarn test
      # Reported (not blocking): the app ships as a native arm64 APK — its ~30 high advisories
      # are almost all build-time Metro/Expo/EAS/tar dev deps that don't run in the APK; the
      # runtime-reachable ones match notify-server's (gated there). See security/dependency-waivers.md.
      - name: Dependency audit (app — reported; see security/dependency-waivers.md)
        run: yarn npm audit --severity high || yarn audit --level high || true

  # ---- Web console: typecheck + build ----
  # The web app reuses the mobile app's src via the `@app` alias, so it needs BOTH the app's
  # deps (yarn) and its own (npm ci) installed to typecheck/build.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install app deps (needed by @app-aliased modules)
        working-directory: dead-mans-vault/app
        run: yarn install --frozen-lockfile
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Web env-precedence tests (Vite loadEnv parity)
        run: node --test dead-mans-vault/release-tools/preflight-web-env.test.mjs
      - name: Type-check
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  # ---- Release-manifest drift guard (cross-component constants) ----
  # Cross-checks release.manifest.json against SOURCE on every PR: PROGRAM_ID (5 sites),
  # FEE_WALLET (rust + app), the 3 hand-synced IDL copies (sha256 equality), and app
  # version/versionCode. Pure node (fs/crypto) — no install, no deps. A drifted constant
  # or an out-of-sync IDL copy fails the PR instead of shipping.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify release manifest matches source
        run: node dead-mans-vault/release-tools/verify-manifest.mjs
      - name: Preflight self-tests (surface-aware bad-config matrix)
        run: node --test dead-mans-vault/release-tools/preflight-prod-build.test.mjs
      - name: Preflight — app surface against the current manifest
        # web surface needs vite's loadEnv (installed only in the `web` job, which runs it via the
        # `npm run build` prebuild + the env-precedence tests below).
        run: node dead-mans-vault/release-tools/preflight-prod-build.mjs --surface app

  # ---- Anchor program: prod-safe build + devnet tests ----
  # Deterministic, host-only program checks (no Solana/Anchor toolchain needed).
  # The prod-floor guard is the load-bearing mainnet-safety gate. The 9-property
  # money-math fuzz suite runs in the separate `fuzz` job below. The full ts-mocha
  # suite (`yarn test:devnet`) still runs locally only — it needs a localnet validator
  # on top of the Anchor build, which the fuzz job (in-process litesvm) does not.
  program:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dead-mans-vault
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0 # project toolchain (matches rust-toolchain.toml)

      - name: Prod-floor guard — default build MUST enforce 1-day / 7-day minimums
        run: cargo test -p dead-mans-vault --lib

      - name: devnet feature asserts the demo floors (10s / 30s)
        run: cargo test -p dead-mans-vault --lib --features devnet

      # BLOCKING: `cargo audit` (default) fails on VULNERABILITIES, passes on informational
      # warnings (unmaintained/unsound) — currently 0 vulns / 5 warnings, documented in
      # security/dependency-waivers.md. Cache the binary so the ~2-3min compile isn't paid each run.
      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22
      - name: Install cargo-audit (cache miss only)
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      - name: cargo audit (BLOCKING — fails on vulnerabilities; see security/dependency-waivers.md)
        run: cargo audit

  # ---- Property-fuzz suite (litesvm + fast-check) ----
  # Runs the 9 money-math fuzz properties (`yarn test:fuzz`) so a program or
  # crank-builder refactor can't silently regress them. Needs `anchor build` (plain =
  # PROD floors) to produce the .so / IDL / types the in-process litesvm harness loads
  # (the suite exercises the real production floors via clock-warp; NO validator).
  # Toolchain + build are cached, so only the first/changed run pays the (historically
  # avm-fragile) install. Separate job → a red run here can't block the others.
  # NOTE: this job is CI-only and unverifiable locally; watch the first run and tune
  # the toolchain step if the avm/Agave install drifts.
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dead-mans-vault
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # anchor-cli pulls hidapi (Ledger support) which links libudev at BUILD and
      # RUN time — not on ubuntu-latest by default. Ungated: a cache-hit run restores
      # the anchor binary but still needs libudev.so present to execute it.
      - name: System deps (libudev for anchor-cli's hidapi)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Cache Solana + Anchor toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/anchor
          key: solana-3.1.10-anchor-0.32.1
      - name: Install Solana (Agave 3.1.10) + Anchor 0.32.1 (cache miss only)
        if: steps.toolchain.outputs.cache-hit != 'true'
        # v3.1.10 = the toolchain this repo builds with (v3.0.15 in the docs is stale +
        # 404s on the CDN). Anchor installed directly from crates.io — no avm-from-source
        # (the historically-fragile step).
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          cargo install anchor-cli --version 0.32.1 --locked --force
      - name: PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache program build
        uses: actions/cache@v6
        with:
          path: dead-mans-vault/target
          key: sbf-target-${{ hashFiles('dead-mans-vault/programs/**', 'dead-mans-vault/Cargo.lock', 'dead-mans-vault/Anchor.toml') }}
      - name: Build program (PROD floors) → .so + IDL + types
        run: anchor build
      - name: Build attestation (.so + IDL sha256) + program-id check
        # Publishes the prod-build hashes (verify on-chain == audited source on a deploy commit)
        # and asserts the freshly-built IDL's program id matches the release manifest.
        run: |
          sha256sum target/deploy/dead_mans_vault.so target/idl/dead_mans_vault.json | tee build-hashes.txt
          BUILT=$(node -e "process.stdout.write(require('./target/idl/dead_mans_vault.json').address)")
          WANT=$(node -e "process.stdout.write(require('./release.manifest.json').programId)")
          echo "built IDL program id: $BUILT  (manifest: $WANT)"
          test "$BUILT" = "$WANT" || { echo "::error::built program id ($BUILT) != manifest ($WANT)"; exit 1; }
      - name: Upload build attestation
        uses: actions/upload-artifact@v4
        with:
          name: build-attestation
          path: dead-mans-vault/build-hashes.txt
          if-no-files-found: warn
      - run: yarn install --frozen-lockfile
      - name: Property-fuzz suite (litesvm + fast-check, prod floors via clock-warp)
        run: yarn test:fuzz

  # ---- Release-tier integration suite (full validator-backed ts-mocha) ----
  # The 39-test suite (tests/dead-mans-vault.ts) needs a REAL validator (it airdrops 500 SOL,
  # impossible on public devnet) + ~86s of real grace waits, so it's too slow for every PR.
  # `workflow_dispatch`-ONLY for now (manual "run the full suite before a deploy"); add
  # main/mainnet/tag triggers once it's proven green across a couple of runs. `anchor test`
  # starts its OWN embedded solana-test-validator (no Agora port-8000 collision in a clean
  # runner — that collision is VPS-only). Prelude mirrors the `fuzz` job.
  integration:
    # Runs on a manual dispatch AND on a push to a release branch (main/mainnet) — i.e. when
    # devnet is promoted toward a deploy. Stays OFF devnet PRs/pushes (too slow: ~8min).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mainnet'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dead-mans-vault
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: System deps (libudev for anchor-cli's hidapi)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Cache Solana + Anchor toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/anchor
          key: solana-3.1.10-anchor-0.32.1
      - name: Install Solana (Agave 3.1.10) + Anchor 0.32.1 (cache miss only)
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          cargo install anchor-cli --version 0.32.1 --locked --force
      - name: PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache program build (devnet feature — separate from the fuzz job's prod build)
        uses: actions/cache@v6
        with:
          path: dead-mans-vault/target
          key: sbf-target-devnet-${{ hashFiles('dead-mans-vault/programs/**', 'dead-mans-vault/Cargo.lock', 'dead-mans-vault/Anchor.toml') }}
      - name: Generate a local keypair (provider wallet; the embedded validator airdrops to it)
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --force -o "$HOME/.config/solana/id.json"
      - run: yarn install --frozen-lockfile
      - name: Full integration suite (anchor build --features devnet + anchor test on a LOCAL validator)
        # Force localnet: Anchor.toml pins cluster=devnet (used for real deploys), but this suite
        # needs a LOCAL validator (it airdrops 500 SOL, impossible on public devnet). Without the
        # override, `anchor test` deploys to real devnet and fails "insufficient funds".
        # --provider.cluster localnet = anchor test's standard flow: start its own
        # solana-test-validator, fund the provider wallet, deploy locally, run the suite.
        run: |
          anchor build -- --features devnet
          anchor test --skip-build --provider.cluster localnet
      - name: Upload validator + program logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            dead-mans-vault/.anchor/
            dead-mans-vault/test-ledger/
          if-no-files-found: ignore
