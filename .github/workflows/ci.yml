name: CI

on:
  push:
    branches: [devnet, main, mainnet]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Notify-server: unit tests + dependency audit ----
  notify-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notify-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24' # match the runtime (systemd runs node 24); node 20's
          # CJS→ESM lexer misses some @coral-xyz/anchor named re-exports
      - run: npm install
      - name: Unit tests (owner-signed register/deregister, etc.)
        run: npm test
      # BLOCKING: fails on any NEW high/critical. Accepted advisories (transitive via
      # @solana/web3.js, low-reachability) are allowlisted in security/audit-ci.jsonc, with
      # full rationale in security/dependency-waivers.md. To accept a new one, add it there.
      - name: Dependency audit (high/critical — BLOCKING; waivers in security/)
        run: npx --yes audit-ci@7 --config ../security/audit-ci.jsonc

  # ---- Mobile app: TypeScript typecheck ----
  app-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dead-mans-vault/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24' # needed for `node --test` TypeScript type-stripping
      - run: yarn install --frozen-lockfile
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests (raw account parsers, etc.)
        run: yarn test
      # Reported (not blocking): the app ships as a native arm64 APK — its ~30 high advisories
      # are almost all build-time Metro/Expo/EAS/tar dev deps that don't run in the APK; the
      # runtime-reachable ones match notify-server's (gated there). See security/dependency-waivers.md.
      - name: Dependency audit (app — reported; see security/dependency-waivers.md)
        run: yarn npm audit --severity high || yarn audit --level high || true

  # ---- Release-manifest drift guard (cross-component constants) ----
  # Cross-checks release.manifest.json against SOURCE on every PR: PROGRAM_ID (5 sites),
  # FEE_WALLET (rust + app), the 3 hand-synced IDL copies (sha256 equality), and app
  # version/versionCode. Pure node (fs/crypto) — no install, no deps. A drifted constant
  # or an out-of-sync IDL copy fails the PR instead of shipping.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify release manifest matches source
        run: node dead-mans-vault/release-tools/verify-manifest.mjs

  # ---- Anchor program: prod-safe build + devnet tests ----
  # Deterministic, host-only program checks (no Solana/Anchor toolchain needed).
  # The prod-floor guard is the load-bearing mainnet-safety gate. The 9-property
  # money-math fuzz suite runs in the separate `fuzz` job below. The full ts-mocha
  # suite (`yarn test:devnet`) still runs locally only — it needs a localnet validator
  # on top of the Anchor build, which the fuzz job (in-process litesvm) does not.
  program:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dead-mans-vault
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0 # project toolchain (matches rust-toolchain.toml)

      - name: Prod-floor guard — default build MUST enforce 1-day / 7-day minimums
        run: cargo test -p dead-mans-vault --lib

      - name: devnet feature asserts the demo floors (10s / 30s)
        run: cargo test -p dead-mans-vault --lib --features devnet

      # Reported (not blocking) this slice; cargo advisories tracked in security/dependency-waivers.md
      # (0 vuln / 5 informational as of 2026-07-06). Gating RUSTSEC via deny.toml is a follow-up.
      - name: cargo audit (reported — see security/dependency-waivers.md)
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || true

  # ---- Property-fuzz suite (litesvm + fast-check) ----
  # Runs the 9 money-math fuzz properties (`yarn test:fuzz`) so a program or
  # crank-builder refactor can't silently regress them. Needs `anchor build` (plain =
  # PROD floors) to produce the .so / IDL / types the in-process litesvm harness loads
  # (the suite exercises the real production floors via clock-warp; NO validator).
  # Toolchain + build are cached, so only the first/changed run pays the (historically
  # avm-fragile) install. Separate job → a red run here can't block the others.
  # NOTE: this job is CI-only and unverifiable locally; watch the first run and tune
  # the toolchain step if the avm/Agave install drifts.
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dead-mans-vault
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # anchor-cli pulls hidapi (Ledger support) which links libudev at BUILD and
      # RUN time — not on ubuntu-latest by default. Ungated: a cache-hit run restores
      # the anchor binary but still needs libudev.so present to execute it.
      - name: System deps (libudev for anchor-cli's hidapi)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Cache Solana + Anchor toolchain
        id: toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/anchor
          key: solana-3.1.10-anchor-0.32.1
      - name: Install Solana (Agave 3.1.10) + Anchor 0.32.1 (cache miss only)
        if: steps.toolchain.outputs.cache-hit != 'true'
        # v3.1.10 = the toolchain this repo builds with (v3.0.15 in the docs is stale +
        # 404s on the CDN). Anchor installed directly from crates.io — no avm-from-source
        # (the historically-fragile step).
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          cargo install anchor-cli --version 0.32.1 --locked --force
      - name: PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache program build
        uses: actions/cache@v6
        with:
          path: dead-mans-vault/target
          key: sbf-target-${{ hashFiles('dead-mans-vault/programs/**', 'dead-mans-vault/Cargo.lock', 'dead-mans-vault/Anchor.toml') }}
      - name: Build program (PROD floors) → .so + IDL + types
        run: anchor build
      - run: yarn install --frozen-lockfile
      - name: Property-fuzz suite (litesvm + fast-check, prod floors via clock-warp)
        run: yarn test:fuzz
